<html lang="en">
<head>
<meta charset="utf-8" />

<meta name="robots" content="noindex, nofollow" />
<title>Prototype</title>
<style>
  :root { --bg: #ffffff; --bg-2: #f5f5f5; --text: #1e1e1e; --text-2: #757575; --border: #e6e6e6; --accent: #0d99ff; --danger: #c4291c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1e1e1e; --bg-2: #2c2c2c; --text: #f5f5f5; --text-2: #a0a0a0; --border: #3a3a3a; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 Inter, system-ui, sans-serif; }
  #app { height: 100%; display: flex; flex-direction: column; }
  /* Player chrome only: prototypes bring their own styles, and these must not reach into them. */
  .lsp-bar button, .lsp-bar select { font: inherit; color: var(--text); background: var(--bg-2); border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  .lsp-bar button:hover { border-color: var(--text-2); }
  .lsp-bar button:disabled { opacity: .45; cursor: default; }
  .lsp-bar button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .lsp-bar :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .lsp-bar { display: flex; align-items: center; gap: 6px; padding: 8px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .lsp-bar .title { flex: 1; min-width: 160px; }
  .lsp-bar .title strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lsp-bar .title span { color: var(--text-2); font-size: 11px; }
  .status { padding: 24px 16px; color: var(--text-2); }
  .status.error { color: var(--danger); }
  .notice { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 6px 12px; border-radius: 6px; max-width: 90%; }

  .coded-stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; background: var(--bg-2); overflow: hidden; }
  .coded-device { position: relative; overflow: hidden; border-radius: 12px; box-shadow: 0 4px 24px rgba(0, 0, 0, .18); background: #fff; flex: none; }
  .coded-desktop { border-radius: 6px; }
  .coded-inner { position: absolute; left: 0; top: 0; transform-origin: 0 0; }

  .list { max-width: 640px; margin: 0 auto; padding: 32px 16px; }
  .list h1 { font-size: 20px; }
  .list ul { padding-left: 18px; line-height: 2; }
  .list a { color: var(--accent); }
</style>
